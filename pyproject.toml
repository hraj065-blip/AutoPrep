[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preppilot"
version = "0.1.0"
description = "From messy data to trusted data."
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.2",
  "pandas==2.3.3",
  "numpy==2.3.3",
  "openpyxl==3.1.5",
  "langgraph==1.2.14",
  "pydantic==2.11.9",
  "PyYAML==6.0.3",
  "python-dotenv==1.1.1",
  "psycopg[binary]==3.2.10",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

